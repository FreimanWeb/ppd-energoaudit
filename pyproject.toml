[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppd-energoaudit"
version = "0.1.0"
description = "Цифровая модель энергоаудита системы ППД (ПАО «Татнефть», Этап 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "xlrd>=2.0", # для парсинга старых форматов Excel (.xls)
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-docx>=1.1",   # парсинг текстовых отчётов энергоаудита (.docx)
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=7.4", "fastapi>=0.115", "uvicorn>=0.30", "httpx2>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "openpyxl", "openpyxl.*", "pandas", "pandas.*", "xlrd", "yaml"]
ignore_missing_imports = true
