# Справочные значения для гидравлического расчёта водоводов.
#
# В реестре трубопроводов (АРМИТС) и в исходных системах шероховатости нет.
# Ниже — абсолютная эквивалентная шероховатость Δэ по типу трубы, материалу и
# внутреннему покрытию. Принятое значение — середина справочного диапазона для
# труб в эксплуатации; диапазон показывается в интерфейсе рядом с расчётом.
# Значения уточняются по результатам обследования (внутритрубная диагностика,
# сравнение расчётного перепада с замеренным по манометрам).
schema: hydraulic_reference.v1

sources:
  idelchik: >-
    Идельчик И.Е. Справочник по гидравлическим сопротивлениям. 3-е изд.,
    перераб. и доп. М.: Машиностроение, 1992. Гл. 2, табл. 2-5
    (шероховатость стенок труб).
  altshul: >-
    Альтшуль А.Д. Гидравлические сопротивления. 2-е изд. М.: Недра, 1982.
  sp_40_102: >-
    СП 40-102-2000. Проектирование и монтаж трубопроводов систем водоснабжения
    и канализации из полимерных материалов.
  sp_31_13330: >-
    СП 31.13330.2021. Водоснабжение. Наружные сети и сооружения.

# Правила применяются сверху вниз; срабатывает первое подходящее.
# Условия: pipe_types — тип трубы из реестра; materials — подстроки материала;
# coatings — подстроки внутреннего покрытия; any_coating — есть покрытие
# (не пусто и не «нет»).
roughness:
  - id: fiberglass
    label: Стеклопластиковая труба
    pipe_types: [СПТ]
    materials: [стеклопласт]
    value_mm: 0.01
    range_mm: [0.005, 0.02]
    sources: [idelchik, sp_40_102]
  - id: polyethylene
    label: Полиэтиленовая или гибкая полимерная труба
    pipe_types: [ГТ]
    materials: [полиэтилен]
    value_mm: 0.01
    range_mm: [0.005, 0.02]
    sources: [sp_40_102]
  - id: glass_enamel
    label: Сталь со стеклоэмалевым покрытием
    coatings: [стекло]
    value_mm: 0.01
    range_mm: [0.005, 0.02]
    sources: [idelchik]
  - id: polymer_lined_steel
    label: Сталь с внутренним полимерным покрытием (ПЭ, эпоксидное)
    any_coating: true
    value_mm: 0.02
    range_mm: [0.01, 0.05]
    sources: [idelchik, sp_40_102]
  - id: steel_in_service
    label: Стальная труба без покрытия в эксплуатации (коррозия, отложения)
    value_mm: 0.5
    range_mm: [0.2, 1.0]
    sources: [idelchik, altshul, sp_31_13330]

# Насосно-компрессорные трубы в стволе скважины (сценарий цепочки).
tubing:
  id: tubing_steel
  label: Стальные НКТ в эксплуатации
  value_mm: 0.1
  range_mm: [0.05, 0.3]
  sources: [idelchik]

# Кинематическая вязкость воды, сСт, по Пуазейлю:
#   ν = 1,78 / (1 + 0,0337·t + 0,000221·t²), t — температура, °C.
viscosity:
  formula: poiseuille
  sources: [idelchik]
