# Журналы дефектов 1С ТОИР (data/toir/*.xls): имя объекта в файле → код в приложении.
# Агрегаты сопоставляются по имени; при расхождении — через aggregates.
schema: toir.v1
plants:
  "КНС-54":
    plant: kns54an
  "КНС-97-2":
    plant: kns97pren
    aggregates:
      "НА-2": "НА-2 ПР"
  "КНС-ОПУ":
    plant: knsopu

# Вид дефекта в журнале 1С ТОИР → строки «Алгоритма определения критичных
# параметров работы НА» (data/reference/reference.json) с вероятными причинами.
defect_algorithm:
  "Вибрация": [7, 8, 9, 10]
  "Перегрев": [11, 12, 13, 14]
  "Внешняя утечка – перекачиваемая среда": [16]
  "Внешняя утечка – вспомогательная среда": [12]
  "Низкая производительность": [1, 2, 3, 4]
  "Засор": [3, 4]
