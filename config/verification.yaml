# Манифест верификации: объекты с эталонными «… расчет.xlsx» из отчётов энергоаудита.
# Пути — относительно data/raw/ntu (ссылка на «НТУ цифровая платформа»).

base_dir: "data/raw/ntu"

# Толерансы сверки (отн. отклонение модель↔эталон). Параметризуемо.
tolerances:
  sec_fact: 0.02        # УРЭ факт — прямое измерение
  eta_fact: 0.05        # КПД факт
  sec_calc: 0.05        # УРЭ расчётный (зависит от η_ном)
  eta_nom: 0.05         # КПД номинальный
  load_factor: 0.10     # K_з
  h_fact: 0.05          # напор фактический
  dw_efficiency: 0.10   # годовые потери по КПД
  dw_throttle: 0.10     # годовые потери на дросселирование

# Толерансы относительных утверждений из прозы отчёта: [отн.доля, абс.порог].
# Эти величины округлены и относительны — допуски мягче + абсолютный порог, чтобы
# малые значения не давали ложных расхождений.
report_tolerances:
  eta_reduction_pp: [0.10, 0.6]    # «КПД снижен на X п.п.»  (порог 0,6 п.п.)
  sec_over_calc:    [0.15, 0.06]   # «УРЭ выше расчётного на X»  (порог 0,06 кВт·ч/м³)
  head_drop_pct:    [0.20, 1.0]    # «рабочая точка ниже на Z %»
  head_drop_m:      [0.20, 6.0]    # «… на N м»

# Каждому объекту — эталонный «… расчет.xlsx» (file: входы+выходы) и текстовый отчёт
# (report: самая поздняя дата; бинарный .doc конвертируется в data/reports/<id>.docx).
objects:
  - id: kns25
    name: "КНС-25"
    file: "Пресная вода/КНС 25 выезд 11.03.2024/кнс 25 расчет.xlsx"
    report: "Пресная вода/КНС 25 выезд 11.03.2024/от 29.03.2024 КНС-25 ДжН отчет НТУ промежуточный.docx"
  - id: kns155bn
    name: "КНС-155 БН"
    file: "пластовая вода/15Кнс 155 БН 28.03.24/кнс-155 расчет.xlsx"
    report: "пластовая вода/15Кнс 155 БН 28.03.24/от 23.04.2024 Промежуточный отчет НТУ по КНС-155 БН.doc"
  - id: kns14an
    name: "КНС-14 АН"
    file: "Пресная вода/КНС 14 АН/КНС 14 АН расчет.xlsx"
    report: "Пресная вода/КНС 14 АН/25.02.2026г. КНС -14 АН отчет.doc"
  - id: knsopu
    name: "КНС-ОПУ"
    file: "агрессивная вода/КНС-ОПУ выезд 08.04.2026г/КНС -ОПУ расчет.xlsx"
    report: "агрессивная вода/КНС-ОПУ выезд 08.04.2026г/05.05.2026г. КНС - ОПУ ДН отчет.doc"
  - id: kns10bn
    name: "КНС-10 БН"
    file: "пластовая вода/13 Кнс 10 БН 27.03.24/кнс-10 расчет.xlsx"
    report: "пластовая вода/13 Кнс 10 БН 27.03.24/от 25.04.2024 Промежуточный отчет НТУ по КНС-10 БН.doc"
  - id: kns154bn
    name: "КНС-154 БН"
    file: "пластовая вода/Кнс 154 БН 28.03.24/кнс-154 расчет.xlsx"
    report: "пластовая вода/Кнс 154 БН 28.03.24/КНС 154 НГДУ БН отчет от 29.08.2024.doc"
  - id: kns155tbn
    name: "КНС-155т БН"
    file: "пластовая вода/16КНС 155т БН 28.03.24/кнс-155 расчет.xlsx"
