# Сопоставление тегов АСУ ТП (выгрузки ТИ/ТС) с метриками модели.
#
# Имя тега имеет вид  KNS__#<объект>#<блок><индекс>#<код>[#I3]
# например            KNS__#0197#PUMP_#003#APWCN#I3
# Суффикс #I3 — накопление за интервал опроса; тот же код без суффикса
# у части тегов означает счётчик с начала эксплуатации, и его брать нельзя.
#
# Источник расшифровок — «Сопоставление тегов 97.xlsx» (docs/scada/).

schema: scada_tags.v1

# Длительность интервала накопления, ч. Из неё считается наработка.
interval_hours: 0.5

# Единица давления по умолчанию. У объекта её можно переопределить: часть
# контроллеров отдаёт давления в кгс/см², и без пересчёта КПД выходит за 1.
pressure_unit: МПа

objects:
  "0197":
    plant: kns97pren
    technical_place: main
    title: "Ек КНС 97"
    aggregates:
      PUMP_001: "НА-1"
      PUMP_003: "НА-3"
  "0297":
    plant: kns97pren
    technical_place: main
    title: "Ек КНС 97ПР"
    aggregates:
      PUMP_002: "НА-2 ПР"

  "5401":
    plant: kns54an
    technical_place: main
    title: "АзН КНС 54"
    pressure_unit: кгс/см²
    aggregates:
      PUMP_001: "НА-1"
      PUMP_002: "НА-2"

  # На ОПУ расходомер стоит только на выкиде станции (узел SLC__001), по
  # агрегатам подачи нет. Станционный расход делится между работающими
  # агрегатами пропорционально их энергии за тот же интервал: агрегаты
  # работают на общую гребёнку при одинаковом давлении выкида, поэтому доля
  # энергии близка к доле объёма. Это допущение, и оно помечается в БД как
  # требующее уточнения.
  "8090":
    plant: knsopu
    technical_place: main
    title: "ДН КНС ОПУ"
    pressure_unit: кгс/см²
    aggregates:
      PUMP_001: "НА-1"
      PUMP_002: "НА-2"
      PUMP_003: "НА-3"
    station_flow:
      unit: SLC__001
      code: QVD__
      integral: true
      metric: q_day
      allocate_by: energy

# Мгновенные значения агрегата: ступенчатый сигнал, храним только изменения.
points:
  PINNA: {metric: p_in, unit: МПа}
  POUNA: {metric: p_out, unit: МПа}
  S_KWT: {metric: power, unit: кВт}

# То же, но по объекту в целом (блок БГ) — без привязки к агрегату.
station_points:
  PKOL_: {metric: p_bg, unit: МПа}

# Накопления за интервал: суммируются в суточное значение.
# integral: true — берётся только вариант тега с суффиксом #I3.
interval_sums:
  QVD__: {metric: q_day, unit: м³/сут, integral: true}
  # Из энергии за интервал выводится мощность (P = W/T, формула 12) — для
  # агрегатов без собственного датчика мощности.
  APWCN:
    metric: energy
    unit: кВт·ч
    integral: true
    # Наработка считается по энергии, а не по расходу: сверка ядра сравнивает
    # моточасы с длительностью положительной мощности, а мощность выводится
    # отсюда же. По расходу счётчик может показывать движение при стоящем НА.
    runtime_source: true
    derive_power: {metric: power, unit: кВт}

# Наработка за сутки: интервалы с ненулевым runtime_source × interval_hours.
runtime:
  metric: runtime
  unit: ч

# Дискретные сигналы из выгрузки ТС.
states:
  NAON_: {metric: pump_state}
